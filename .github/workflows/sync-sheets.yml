name: Sync Google Sheets Data

on:
  schedule:
    # Run every 6 hours automatically (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync from Google Sheets & Export Partitions
        run: |
          npm run sync

      - name: Commit and Push Updated Data to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.csv data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync fresh CSV & partitions from Google Sheets [skip ci]" && git push)
